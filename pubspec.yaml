name: pmp
description: "Quiz live PMP (ECO 2026)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icone Material — già incluse, referenziate esplicitamente per chiarezza
  cupertino_icons: ^1.0.8

  # Backend: auth trainer, database domande/sessioni, realtime live dashboard
